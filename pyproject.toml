[project]
name = "forecast-correction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Ruijs", email = "daniel.ruijs@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "modal>=1.6.4",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.5",
    "polars>=2.2.0",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[project.scripts]
fc-data = "forecast_correction.data.__main__:main"
